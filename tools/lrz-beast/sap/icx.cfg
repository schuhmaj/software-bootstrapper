# icx config for the SAP node (Sapphire Rapids + Intel PVC).
# Auto-loaded by icx from its own bin/ directory. Same content as icpx.cfg —
# icx handles C sources and CMake compiler probes. See README.md.
# TEMPLATE — regenerate on-system so the literal Spack paths match the loaded
# gcc/14 module:
#   export GCC_INSTALL_DIR=$(dirname "$(gcc -print-file-name=crtbegin.o)")
#   export GCC_LIB_DIR=$(realpath "$(dirname "$(g++ -print-file-name=libstdc++.so)")")
#   printf -- '--gcc-install-dir=%s\n-Wl,-rpath=%s\n' "$GCC_INSTALL_DIR" "$GCC_LIB_DIR"
--gcc-install-dir=<GCC_INSTALL_DIR>/lib/gcc/x86_64-pc-linux-gnu/14.2.0
-Wl,-rpath=<GCC_LIB_DIR>/lib64
